name: Build & Release

# Triggers:
#   - Push a version tag (v1.0.0, v1.2.3-beta, …) → full build + GitHub release
#   - Manual run via Actions UI → build only, no release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build fat JAR
        run: ./gradlew build

      # Resolve version: tag name on tag push, "dev" on manual trigger
      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Package distribution zip
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          ZIP_NAME="elite-vault-${VERSION}.zip"
          echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"
          cd distribution
          zip -r "../${ZIP_NAME}" .
          echo "Packaged: $(ls -lh ../${ZIP_NAME} | awk '{print $5, $9}')"

      - name: Upload zip as artifact
        uses: actions/upload-artifact@v4
        with:
          name: elite-vault-${{ steps.version.outputs.VERSION }}
          path: elite-vault-${{ steps.version.outputs.VERSION }}.zip

      # Only publish a GitHub release on tag pushes
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
